# The full stack, started with:  docker compose up -d --build
#
#   app         the semantic cache (API + playground)   http://localhost:8000
#   redis       cached answers and the lookup log
#   prometheus  collects the app's metrics              http://localhost:9090
#   grafana     dashboard (no login needed to view)     http://localhost:3000
#
# The app reads GEMINI_API_KEY (and any other settings) from .env.
#
# For development, run only Redis here and the app on your machine:
#   docker compose up -d redis   &&   uv run semcache
#
# Every host port can be changed if it's already in use, e.g.:
#   REDIS_PORT=6380 APP_PORT=8001 docker compose up -d --build
services:
  app:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      # Inside the stack, Redis is reached by its service name.
      REDIS_URL: redis://redis:6379
    ports:
      - "${APP_PORT:-8000}:8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # Redis Stack: Redis plus the RediSearch module that vector search needs.
  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - app
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      # Anyone can view the dashboard; log in as admin / admin to edit it.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      # Open straight onto the semantic cache dashboard.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/semcache.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      # Use the built-in plugins as shipped. By default Grafana downloads
      # plugin updates after starting, and while it swaps the Prometheus
      # plugin every panel shows an error (for a minute on a slow
      # connection, indefinitely with no internet).
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GF_PLUGINS_PREINSTALL_AUTO_UPDATE: "false"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  redis-data:
  prometheus-data:
  grafana-data:
