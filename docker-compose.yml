# Redis Stack: Redis plus the RediSearch module that vector search needs.
# Start it with:  docker compose up -d
# The app itself runs on the host (uv run semcache) and connects via REDIS_URL.
services:
  redis:
    image: redis/redis-stack-server:latest
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  redis-data:
